naftiko: 1.0.0-alpha2
info:
  label: Google Chrome Management API — Telemetry Users
  description: 'Google Chrome Management API — Telemetry Users. 2 operations. Lead operation: List telemetry users. Self-contained
    Naftiko capability covering one Google Chrome business surface.'
  tags:
  - Google Chrome
  - Telemetry Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CHROME_API_KEY: GOOGLE_CHROME_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-telemetry-users
    baseUri: https://chromemanagement.googleapis.com/v1
    description: Google Chrome Management API — Telemetry Users business capability. Self-contained, no shared references.
    resources:
    - name: customers-customerId-telemetry-users
      path: /customers/{customerId}/telemetry/users
      operations:
      - name: listtelemetryusers
        method: GET
        description: List telemetry users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageSize
          in: query
          type: integer
          description: Maximum number of results to return.
        - name: pageToken
          in: query
          type: string
          description: Token to specify next page in the result set.
        - name: filter
          in: query
          type: string
          description: Filter to restrict results. Supports filtering by user email and org unit.
        - name: readMask
          in: query
          type: string
          description: Fields to include in the response.
    - name: customers-customerId-telemetry-users-userId
      path: /customers/{customerId}/telemetry/users/{userId}
      operations:
      - name: gettelemetryuser
        method: GET
        description: Get a telemetry user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: userId
          in: path
          type: string
          description: Unique identifier of the telemetry user.
          required: true
        - name: readMask
          in: query
          type: string
          description: Fields to include in the response.
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CHROME_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-telemetry-users-rest
    port: 8080
    description: REST adapter for Google Chrome Management API — Telemetry Users. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/customers/{customerid}/telemetry/users
      name: customers-customerid-telemetry-users
      description: REST surface for customers-customerId-telemetry-users.
      operations:
      - method: GET
        name: listtelemetryusers
        description: List telemetry users
        call: management-telemetry-users.listtelemetryusers
        with:
          pageSize: rest.pageSize
          pageToken: rest.pageToken
          filter: rest.filter
          readMask: rest.readMask
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/customers/{customerid}/telemetry/users/{userid}
      name: customers-customerid-telemetry-users-userid
      description: REST surface for customers-customerId-telemetry-users-userId.
      operations:
      - method: GET
        name: gettelemetryuser
        description: Get a telemetry user
        call: management-telemetry-users.gettelemetryuser
        with:
          userId: rest.userId
          readMask: rest.readMask
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-telemetry-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Chrome Management API — Telemetry Users. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-telemetry-users
      description: List telemetry users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-telemetry-users.listtelemetryusers
      with:
        pageSize: tools.pageSize
        pageToken: tools.pageToken
        filter: tools.filter
        readMask: tools.readMask
      outputParameters:
      - type: object
        mapping: $.
    - name: get-telemetry-user
      description: Get a telemetry user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-telemetry-users.gettelemetryuser
      with:
        userId: tools.userId
        readMask: tools.readMask
      outputParameters:
      - type: object
        mapping: $.
