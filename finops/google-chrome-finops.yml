specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Google Chrome
providerId: google-chrome
publisherName: Google LLC
serviceCategory: Browser / Developer Tools
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Browser
  - Chrome Extensions
  - Developer Tools
  - Web Platform
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Chrome: the developer-platform surface is free, with two narrow
  paid lines - the one-time $5 Chrome Web Store developer registration and the $6/user/month Chrome Enterprise
  Premium subscription. Premium invoicing flows through Google Workspace billing; CrUX/PageSpeed Insights
  API costs are zero.'
sources:
  - https://chromeenterprise.google/pricing/
  - https://developer.chrome.com/docs/webstore/register
  - https://workspace.google.com/pricing
billingModel:
  pricingCategory: Subscription + One-Time
  billingFrequency: Monthly (Premium) / One-Time (Webstore)
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
focusColumns:
  ServiceName: Chrome / Chrome Enterprise
  ServiceCategory: Browser / Endpoint Management
  ProviderName: Google
  PublisherName: Google LLC
  InvoiceIssuerName: Google LLC
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: chrome_enterprise_premium_seats
    description: Active Chrome Enterprise Premium licensed users
    unit: seat-month
    aggregation: max
    dimensions:
      - org_unit
      - region
  - name: webstore_developer_registration
    description: Chrome Web Store developer account one-time fee
    unit: account
    aggregation: count
    dimensions:
      - publisher
  - name: crux_api_requests
    description: Cloud-billed CrUX API requests (free at default quota)
    unit: request
    aggregation: sum
    dimensions:
      - api_key
      - origin
  - name: pagespeed_api_requests
    description: Cloud-billed PageSpeed Insights API requests
    unit: request
    aggregation: sum
    dimensions:
      - api_key
apis:
  - name: Chrome Extensions API
    baseURL: chrome://extensions/
    serviceName: Chrome Extensions API
    serviceCategory: Browser
  - name: Chrome User Experience (CrUX) API
    baseURL: https://chromeuxreport.googleapis.com
    serviceName: CrUX API
    serviceCategory: Web Performance
  - name: PageSpeed Insights API
    baseURL: https://pagespeedonline.googleapis.com
    serviceName: PageSpeed Insights API
    serviceCategory: Web Performance
  - name: Chrome Web Store Publish API
    baseURL: https://www.googleapis.com/chromewebstore
    serviceName: Chrome Web Store Publish API
    serviceCategory: Distribution
principles:
  - name: Visibility
    description: For Chrome Enterprise Premium, view per-seat consumption in the Google Workspace Admin
      console subscriptions page; for the CrUX/PageSpeed Insights APIs, monitor request volume in the
      Google Cloud Console.
  - name: Allocation
    description: Allocate Premium seats by org-unit (department/team) in the Admin console; tag CrUX/PageSpeed
      API keys per consuming team for per-team usage attribution.
  - name: Optimization
    description: Reclaim inactive Premium seats monthly using the Admin console's last-active reports;
      cache CrUX results since underlying data updates only weekly/monthly; consolidate CrUX/PageSpeed
      API keys to share quota across teams.
  - name: Accountability
    description: Assign a license owner per organizational unit; review Premium seat utilization quarterly
      and right-size; the Webstore registration is a sunk one-time cost owned by the publisher account
      holder.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
