specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Chrome
providerId: google-chrome
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Browser
  - Chrome Extensions
  - Developer Tools
  - Web Platform
description: The Chrome browser and its developer-facing APIs (Extensions, DevTools Protocol, Web Platform
  primitives) are free. Commercial pricing applies only to Chrome Enterprise Premium for managed-fleet
  customers and the one-time Chrome Web Store developer registration fee.
sources:
  - https://chromeenterprise.google/pricing/
  - https://developer.chrome.com/docs/extensions/
  - https://developer.chrome.com/docs/webstore/register
plans:
  - id: google-chrome-developer-platform
    name: Chrome Developer Platform
    type: freemium
    description: Free access to Chrome's developer APIs - Extensions, DevTools Protocol, Web Platform
      primitives, and the Chrome User Experience (CrUX) API. Used to build extensions, automate the browser,
      and instrument web performance.
    entries:
      - label: Browser and APIs
        description: Chrome browser plus all developer-facing APIs
        name: dev_apis
        type: subscription
        metric: usage
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://developer.chrome.com
          - https://chromeapis.google.com
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Chrome Extensions API
      - name: Chrome DevTools Protocol
      - name: Web Platform APIs
      - name: Chrome User Experience (CrUX) API
      - name: PageSpeed Insights API
  - id: google-chrome-webstore-developer
    name: Chrome Web Store Developer Account
    type: subscription
    description: One-time fee to publish extensions on the Chrome Web Store.
    entries:
      - label: Developer registration
        description: One-time registration fee for a Chrome Web Store developer account
        name: webstore_dev_registration
        type: flat
        metric: account
        limit: 1
        timeFrame: usage
        geo: global
        domains:
          - https://chrome.google.com/webstore
        unit: 1
        price: '5.00'
        userMultiplied: false
    elements:
      - name: Publish extensions to the Chrome Web Store
      - name: Distribute via group publisher accounts
  - id: google-chrome-enterprise-core
    name: Chrome Enterprise Core
    type: freemium
    description: Free management tier for IT teams to deploy and manage Chrome browser at scale via the
      Google Admin console (policies, version pinning, extension allowlists).
    entries:
      - label: Per-user license
        description: Free per-user license
        name: enterprise_core_license
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://admin.google.com
        unit: 1
        price: '0.00'
        userMultiplied: true
    elements:
      - name: Centralized policy management
      - name: Extension management
      - name: Reporting and version control
      - name: Admin console access
  - id: google-chrome-enterprise-premium
    name: Chrome Enterprise Premium
    type: subscription
    description: Paid tier adding advanced security (data loss prevention, context-aware access, threat
      and data protection insights) and Gemini-in-Chrome AI features for managed users.
    entries:
      - label: Per-user license
        description: Per-user monthly subscription
        name: enterprise_premium_license
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://admin.google.com
        unit: 1
        price: '6.00'
        userMultiplied: true
    elements:
      - name: All Chrome Enterprise Core features
      - name: Data loss prevention (DLP)
      - name: Context-aware access controls
      - name: Threat and data protection insights
      - name: Gemini in Chrome (Help me write, Tab organizer)
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
