specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Google Chrome
providerId: google-chrome
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Browser
  - Chrome Extensions
  - Developer Tools
  - Web Platform
  - Rate Limiting
description: 'Most Chrome developer APIs run in-process inside the browser and have per-extension or per-API
  internal limits rather than network-rate limits. Two cloud-hosted Chrome APIs do enforce server-side
  quotas: the Chrome User Experience (CrUX) API and PageSpeed Insights API, which share the standard
  Google Cloud API project quotas (default 25,000 queries per day per API key with per-100-second per-user
  caps). The Chrome Web Store publishing API has per-publisher daily limits.'
sources:
  - https://developer.chrome.com/docs/crux/api
  - https://developers.google.com/speed/docs/insights/v5/get-started
  - https://developer.chrome.com/docs/webstore/api
responseCodes:
  throttled: 429
  quotaExceeded: 403
limits:
  - name: CrUX API queries per day
    scope: api-key
    metric: requests_per_day
    limit: 150
    timeFrame: day
    notes: Default per-API-key daily quota; can be raised via the Cloud Console quotas page.
  - name: CrUX API queries per minute per user
    scope: user
    metric: requests_per_minute
    limit: 30
    timeFrame: minute
  - name: PageSpeed Insights queries per day
    scope: api-key
    metric: requests_per_day
    limit: 25000
    timeFrame: day
  - name: PageSpeed Insights queries per 100 seconds
    scope: api-key
    metric: requests_per_100_seconds
    limit: 400
    notes: 400 queries per 100 seconds per API key.
  - name: Chrome Web Store Publish API
    scope: developer-account
    metric: requests_per_day
    limit: see Cloud Console quota
    notes: Standard Google API project quota; raise via the Cloud Console.
  - name: Extension chrome.storage.sync per item
    scope: extension
    metric: bytes
    limit: 8192
    notes: 8 KB per item; 100 KB total quota for sync storage.
  - name: Extension chrome.storage.sync write operations
    scope: extension
    metric: writes_per_minute
    limit: 120
    timeFrame: minute
    notes: Maximum sustained write operations to chrome.storage.sync.
policies:
  - name: API project quotas
    description: Cloud-hosted Chrome APIs (CrUX, PageSpeed Insights) follow the standard Google Cloud
      API project quota model and can be raised via the Cloud Console quotas page.
  - name: In-browser API rate limits
    description: Extension APIs enforce per-extension internal limits (e.g., chrome.storage.sync write
      throughput, chrome.alarms minimum interval, chrome.tabs operation rates). These are not network-rate
      limits and are documented per API in developer.chrome.com.
  - name: Backoff
    description: Honor 429 / 403 quotaExceeded with exponential backoff and jitter; cache CrUX responses
      since underlying data updates only daily/weekly.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
